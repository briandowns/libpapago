name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  package:
    strategy:
      matrix:
        include:
          - os: ubuntu-26.04
            arch: amd64
          - os: ubuntu-26.04-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev libgnutls28-dev \
            libjansson-dev libwebsockets-dev libmicrohttpd-dev git
          git clone --depth 1 https://github.com/briandowns/libmaple.git /tmp/libmaple
          make -C /tmp/libmaple && sudo make -C /tmp/libmaple install && sudo ldconfig
      - name: Build
        run: make PAPAGO_WITH_WSC=1
      - name: Stage files
        run: |
          VER=${GITHUB_REF_NAME#v}
          PKG=libpapago-${VER}-linux-${{ matrix.arch }}
          mkdir -p $PKG/usr/local/{include,lib} $PKG/usr/local/share/man/man3 $PKG/DEBIAN
          cp papago.h papago_wcs.h $PKG/usr/local/include/
          cp papago_client.h $PKG/usr/local/include/
          cp libpapago*.so /usr/local/lib/libmaple.so $PKG/usr/local/lib/
          cp papago.3 $PKG/usr/local/share/man/man3/
          cat > $PKG/DEBIAN/control <<EOF
          Package: libpapago
          Version: ${VER}
          Architecture: ${{ matrix.arch }}
          Maintainer: Brian Downs
          Depends: libmicrohttpd-dev, libwebsockets-dev, libssl3t64, libgnutls30t64
          Description: libpapago C HTTP/WebSocket library
          EOF
          echo 'activate-noawait ldconfig' > $PKG/DEBIAN/triggers
          dpkg-deb --build $PKG ${PKG}.deb
          tar czf ${PKG}.tar.gz -C $PKG usr
          sha256sum ${PKG}.deb ${PKG}.tar.gz > ${PKG}.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.arch }}
          path: |
            libpapago-*.deb
            libpapago-*.tar.gz
            libpapago-*.sha256

  release:
    needs: package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: pkg-*
          merge-multiple: true
      - name: Source tarball
        run: git archive --prefix=libpapago-${GITHUB_REF_NAME#v}/ -o libpapago-${GITHUB_REF_NAME#v}-src.tar.gz HEAD
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            libpapago-*.deb
            libpapago-*.tar.gz
            libpapago-*.sha256

  image:
    needs: package
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.ubuntu
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:latest

